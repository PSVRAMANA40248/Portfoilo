<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | P. Sai Venkat Ramana</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Space Grotesk',sans-serif;
    }

    body{
      min-height:100vh;
      background:#111827;
      color:#fff;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:40px 20px;
    }

    h1{
      text-align:center;
      font-size:3rem;
      margin-bottom:20px;
      background:linear-gradient(90deg,#38bdf8,#a855f7,#ec4899);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .form-box{
      max-width:600px;
      margin:auto;
      padding:30px;
      border-radius:20px;
      background:rgba(255,255,255,0.05);
    }

    .input-group{
      margin-bottom:15px;
    }

    input, textarea{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#1f2937;
      color:white;
    }

    textarea{
      height:120px;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      margin-top:10px;
      font-weight:bold;
      cursor:pointer;
    }

    .whatsapp{
      background:#25D366;
    }

    .telegram{
      background:#229ED9;
    }

    #status-message{
      text-align:center;
      margin-top:10px;
    }

    .social{
      text-align:center;
      margin-top:30px;
    }

    .social a{
      margin:10px;
      font-size:25px;
      color:white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Contact Me</h1>

  <div class="form-box">
    <form id="contact-form">

      <div class="input-group">
        <input type="text" id="name" placeholder="Your Name" required>
      </div>

      <div class="input-group">
        <input type="email" id="email" placeholder="Your Email" required>
      </div>

      <div class="input-group">
        <input type="text" id="subject" placeholder="Subject" required>
      </div>

      <div class="input-group">
        <textarea id="message" placeholder="Your Message" required></textarea>
      </div>

      <!-- WhatsApp -->
      <button type="button" class="btn whatsapp" onclick="sendWhatsApp()">
        <i class="fab fa-whatsapp"></i> Send via WhatsApp
      </button>

      <!-- Telegram -->
      <button type="button" class="btn telegram" onclick="sendTelegram()">
        <i class="fab fa-telegram"></i> Send via Telegram
      </button>

      <p id="status-message"></p>

    </form>
  </div>

  <!-- Social Links -->
  <div class="social">
    <a href="https://www.instagram.com/pusarla_ramana/" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://t.me/UNLUCKYBOY_2005" target="_blank">
      <i class="fab fa-telegram"></i>
    </a>
  </div>

</div>

<script>
function getFormData() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const subject = document.getElementById("subject").value;
  const message = document.getElementById("message").value;

  if (!name || !email || !subject || !message) {
    document.getElementById("status-message").innerText = "Fill all fields!";
    return null;
  }

  return {
    text:
      `Hello,%0A%0AName: ${name}%0AEmail: ${email}%0ASubject: ${subject}%0A%0AMessage:%0A${message}`
  };
}

/* WhatsApp */
function sendWhatsApp() {
  const data = getFormData();
  if (!data) return;

  const url = `https://wa.me/919182709036?text=${data.text}`;
  window.open(url, "_blank");

  document.getElementById("status-message").innerText = "Opening WhatsApp...";
}

/* Telegram */
function sendTelegram() {
  const data = getFormData();
  if (!data) return;

  const url = `https://t.me/UNLUCKYBOY_2005?text=${data.text}`;
  window.open(url, "_blank");

  document.getElementById("status-message").innerText = "Opening Telegram...";
}
</script>

</body>
</html>
